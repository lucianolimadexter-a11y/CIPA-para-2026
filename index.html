:root{color-scheme:light}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
.app{position:fixed;inset:0;display:flex;flex-direction:column}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 12px}

.mrow{display:flex;align-items:center;gap:14px;width:100%;appearance:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px;margin:0 0 10px;text-align:left;color:var(--ink);font:inherit}

.mrow b{display:block}.mrow .s{font-size:.85rem;color:var(--soft)}.mrow::after{content:'›';margin-left:auto;font-size:1.5rem;color:var(--soft)}

.cb.on i{background:var(--pri);border-color:var(--pri)}.cb.on i::after{content:'✓'}.cb.on span{font-weight:600}
.cbl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 14px;margin:0 0 14px}
.stk{position:sticky;bottom:-28px;margin:20px -16px -28px;padding:12px 16px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;z-index:5}
.back{appearance:none;border:0;background:none;color:var(--pri);font:700 1rem system-ui;padding:0 0 12px;cursor:pointer}




h1{font-size:1.45rem;margin:4px 0 4px;line-height:1.2}h2{font-size:1.1rem;margin:20px 0 8px}h3{font-size:1rem;margin:0 0 6px}
p{margin:0 0 .7em}.muted{color:var(--soft)}.small{font-size:.86rem}

.opt{display:block;width:100%;text-align:left;appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;padding:13px 14px;border-radius:14px;margin:0 0 9px}

.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 14px}.bar i{display:block;height:100%;background:var(--pri)}
label.f{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{appearance:none;border:2px solid var(--line);background:var(--card);color:var(--ink);font:600 .9rem system-ui;padding:9px 13px;border-radius:999px}.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}

.dbox h3{margin:0 0 8px;font:800 1.2rem system-ui,sans-serif;color:#14263A}
.dbox p{margin:0 0 18px;color:#4A5E73;font-size:.95rem;line-height:1.45}
.dbt{display:flex;gap:10px}.dbt button{flex:1;appearance:none;border-radius:14px;padding:13px 8px;font:800 1rem system-ui,sans-serif}
.dbt .dno{background:#fff;color:#0A5CA8;border:2px solid #B8C8DA}.dbt .dok{background:#C8402F;color:#fff;border:2px solid #C8402F}
@keyframes dfade{from{opacity:0}to{opacity:1}}@keyframes dpop{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.hist .hf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}.hist .hf img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.35);display:block}

<script>
'use strict';
/* ===== Configuração (a CIPA pode preencher antes de distribuir) ===== */
const CONFIG={
  contatos:[
    {n:'SAMU',t:'192',fixo:true},{n:'Bombeiros',t:'193',fixo:true},
    {n:'CIPA',t:''},{n:'Ambulatório / SESMT',t:''},{n:'Brigada de emergência',t:''}
  ]
};
const SST=[
 {k:'calor',e:'🌡️',n:'Calor e hidratação',intro:'Calor forte cansa o corpo mais rápido e derruba a atenção. Água e pausas são parte da segurança.',items:[
  'Beba água em goles pequenos e frequentes, cerca de um copo a cada 15 a 20 minutos em calor forte, mesmo sem sede.',
  'Urina escura é sinal de pouca água. Clara ou amarelo-claro indica que está bem.',
  'Faça pausas em local fresco e com sombra. Não espere o corpo "pedir arrego".',
  'Evite energético e muito café no calor: aumentam a perda de líquido e a sensação de coração acelerado.',
  'Depois de folga ou férias o corpo perde parte da adaptação ao calor. Nos primeiros dias, vá com mais calma.',
  'Sinais de alerta: tontura, cãibra, náusea, dor de cabeça forte, pele muito quente e seca. Pare, vá para local fresco e avise colega ou líder.'],
  help:'Confusão mental, desmaio ou pele quente e seca sem suor é emergência. Acione o ambulatório ou o SAMU (192).'},
 {k:'ruido',e:'🔊',n:'Ruído e audição',intro:'A perda de audição por ruído é lenta e não volta. Você só percebe quando já aconteceu.',items:[
  'Use o protetor auricular sempre que a área estiver sinalizada, mesmo "só por um minutinho".',
  'Confira o encaixe. No tipo plug, puxe a orelha para cima e para trás ao inserir. No tipo concha, cabelo ou haste de óculos atrapalham a vedação.',
  'Troque o protetor sujo, ressecado ou deformado.',
  'Sinais de alerta: zumbido ao sair do turno, sensação de ouvido tapado, precisar aumentar o volume da TV ou pedir para repetirem.',
  'Dê descanso aos ouvidos: evite fone em volume alto no trajeto e em casa depois do turno.',
  'Faça a audiometria dos exames periódicos e leve a sério o resultado.'],
  help:'Zumbido que não passa ou piora da audição: procure o ambulatório ou o médico do trabalho.'},
 {k:'epi',e:'🦺',n:'Uso correto de EPI',intro:'EPI é a última barreira entre você e o acidente. Só funciona se for o certo, estiver em bom estado e for usado inteiro.',items:[
  'Confira antes de começar: óculos sem riscos, luva adequada ao risco, capacete sem trincas e bem ajustado, calçado com solado bom.',
  'Use o EPI indicado para a tarefa. Luva errada pode dar falsa segurança.',
  'Não improvise nem adapte o EPI. Se está apertado, quebrado ou desconfortável, peça troca.',
  'Confira o CA (Certificado de Aprovação) e a validade quando houver.',
  'Perto de partes giratórias ou energizadas, tire anéis, correntes, pulseiras e relógio, e prenda o cabelo.',
  'Guarde limpo e seco. EPI jogado no fundo do armário se estraga.',
  'A NR-6 define que a empresa fornece o EPI certo e que o trabalhador usa e conserva. Se faltar, avise o líder ou a CIPA.']},
 {k:'eletrico',e:'⚡',n:'Eletricidade e energias perigosas',intro:'Lembrete geral. Siga sempre o procedimento, a permissão de trabalho e o treinamento da sua área (NR-10 e normas internas).',items:[
  'Desenergize, bloqueie e etiquete antes de intervir. Cadeado e etiqueta são seus, e só você retira.',
  'Teste a ausência de tensão com instrumento adequado e verificado. "Deve estar desligado" não vale.',
  'Lembre da energia residual: capacitores, pressão, mola, peso suspenso, inércia de motor.',
  'Não trabalhe sozinho em tarefa de risco elétrico. Combine como pedir ajuda.',
  'Use o EPI e as ferramentas isoladas próprios para o nível de tensão.',
  'Pressa e rotina são os maiores riscos. Quanto mais conhecida a tarefa, mais atenção ao primeiro passo.',
  'Se levar um choque, mesmo leve e "sem nada", comunique e passe por avaliação médica. Alterações no coração podem aparecer depois.'],
  help:'Choque com queimadura, desmaio, palpitação ou formigamento: emergência. Acione o ambulatório ou o SAMU (192).'},
 {k:'ergo',e:'🧍',n:'Ergonomia e levantamento de peso',intro:'Coluna, ombros e punhos aguentam muito, mas não aguentam repetição sem cuidado (NR-17).',items:[
  'Chegue perto da carga, afaste os pés, dobre os joelhos e mantenha a coluna reta. Levante com as pernas.',
  'Não torça o tronco com peso. Mova os pés para virar.',
  'Carga pesada ou desajeitada pede ajuda de outra pessoa ou de equipamento. Não é fraqueza.',
  'Muito tempo em pé: alterne o apoio, mexa as pernas, use calçado adequado e faça pausas.',

  'Dor que volta todo dia ou piora ao longo do turno é sinal de que algo na tarefa ou no posto precisa mudar.'],
  help:'Dor com formigamento, perda de força ou que irradia para a perna ou o braço: procure o ambulatório.'},
 {k:'fadiga',e:'😴',n:'Cansaço, turnos e sonolência',intro:'Sono curto e turno da noite reduzem atenção e reflexo. O maior risco costuma ser no trajeto de volta.',items:[
  'Sinais de sonolência: bocejo repetido, piscadas lentas, cabeça pesada, perder trechos do caminho, tarefa feita no automático.',
  'Ao sentir isso, mexa-se, beba água, lave o rosto e troque de atividade. Café ajuda pouco e por pouco tempo.',

 {k:'olhosmaos',e:'🖐️',n:'Olhos e mãos',intro:'São as partes que mais se machucam no trabalho, e quase sempre de forma evitável.',items:[
  'Óculos de proteção sempre que houver projeção de partículas, cavaco, faísca ou líquido, mesmo em tarefa rápida.',

  'Use a ferramenta certa para cada serviço. Chave de fenda não é talhadeira.',
  'Olhe onde pôr a mão: pontos de esmagamento, prensamento e partes quentes ou giratórias.',
  'Corte ou ferida, mesmo pequeno: limpe, proteja e comunique. Infecção começa pequena.'],
  help:'Corpo estranho no olho, queimadura, corte profundo ou perda de sensibilidade nos dedos: ambulatório na hora.'},
 {k:'alimentacao',e:'🍽️',n:'Sono e alimentação no turno',intro:'Turnos bagunçam o relógio do corpo. Rotina simples ajuda a segurar o prejuízo.',items:[
  'Mantenha horários mais ou menos fixos para as refeições, mesmo na folga.',
  'No meio da noite, prefira refeição leve. Evite comida pesada e frita de madrugada.',
  'Leve lanche de reserva: fruta, castanha, iogurte, sanduíche. Doce e energético dão pico e depois queda.',

  'Para dormir de dia: quarto escuro, silêncio, celular no silencioso, aviso para a casa e tampão de ouvido se precisar.',
  'Pouca luz forte ao voltar para casa do turno da noite ajuda o corpo a entender que é hora de dormir.',
  'Cafeína sempre longe do horário em que você vai dormir.']},
 {k:'mental',e:'🧠',n:'Estresse e saúde mental',intro:'Cabeça sobrecarregada também causa acidente e adoece. Cuidar dela faz parte da segurança.',items:[
  'Pausa de 1 minuto: inspire contando até 4 e solte contando até 6, algumas vezes. Ajuda a baixar a tensão.',
  'Converse com alguém de confiança. Guardar tudo pesa mais.',
  'Pressa e preocupação tiram atenção. Quando perceber, respire e volte ao primeiro passo da tarefa.',
  'Sinais de esgotamento: irritação constante, insônia, desânimo por semanas, sensação de que nada importa.',
  'Assédio ou pressão excessiva no trabalho não é "normal". A CIPA e o canal de denúncia existem para isso.',
  'Pedir ajuda é cuidado, não fraqueza.'],
  help:'Se estiver pensando em se machucar ou desistir, ligue agora para o CVV, 188 (gratuito, 24 horas). Em risco imediato, SAMU 192.'},
 {k:'cotidiano',e:'👀',n:'Atenção no dia a dia da área',intro:'A maioria dos acidentes nasce de pequenos descuidos repetidos.',items:[
  'Não pule etapa do procedimento por pressa. Se está difícil de cumprir, avise: o procedimento pode precisar de ajuste.',
  'Celular na mão em área operacional distrai. Guarde ou pare antes de usar.',
  'Escadas e plataformas: três pontos de apoio e sem carregar peso que tire a mão do corrimão.',
  'Veículos e empilhadeiras: contato visual com o condutor antes de cruzar e nunca passe por trás.',
  'Ordem e limpeza evitam queda e tropeço. Piso molhado ou com material, sinalize e limpe.',
  'Viu condição insegura ou quase-acidente? Comunique ao líder ou à CIPA. É um aviso grátis.',
  'A CIPA (NR-5) é a Comissão Interna de Prevenção de Acidentes e de Assédio. Os cipeiros são colegas que levam sua observação adiante.']},
 {k:'ajuda',e:'🏥',n:'Quando procurar ajuda',intro:'Orientação geral, não é diagnóstico. Na dúvida, procure o ambulatório ou o SESMT.',items:[
  'Emergência (SAMU 192 e brigada ou ambulatório da empresa): dor no peito, falta de ar, desmaio, queimadura extensa, sangramento forte, corpo estranho no olho, choque elétrico com sintomas, fraqueza súbita de um lado do corpo, dor de cabeça muito forte e repentina.',
  'Procure o ambulatório ou o médico do trabalho: dor que dura mais de uma ou duas semanas, formigamento recorrente, zumbido, cansaço que não passa, tosse prolongada, sono muito ruim por semanas.',
  'Qualquer acidente, mesmo pequeno, deve ser comunicado. Isso protege você.',
  'Se algo no ambiente te deixa doente ou com medo, fale com seu líder, com a CIPA ou com o SESMT.',
  'Este app não substitui consulta nem orientação do SESMT. Na dúvida sobre sua saúde, procure o ambulatório ou o médico do trabalho.']}
];
const QZ=[
 ['Em calor forte, qual é a melhor forma de se hidratar?',['Pequenos goles de água com frequência, mesmo sem sede','Só beber quando sentir muita sede','Tomar energético para repor energia','Beber um litro de uma vez no fim do turno'],0,'Pequenos goles frequentes, cerca de um copo a cada 15 a 20 minutos em calor forte. A sede aparece quando o corpo já perdeu água.'],
 ['Urina escura geralmente indica:',['Pouca água no corpo','Hidratação perfeita','Excesso de vitamina','Nada importante'],0,'Urina escura é sinal de pouca água. Clara ou amarelo-claro indica boa hidratação.'],
 ['Você sai do turno com zumbido no ouvido. O que isso indica?',['É normal e passa sempre','Sinal de alerta: o ruído pode estar afetando a audição','Cansaço dos olhos','Pressão do ar'],1,'Zumbido após o turno é sinal de alerta. Confira o protetor auricular e procure o ambulatório se persistir.'],
 ['Como inserir corretamente um protetor auricular tipo plug?',['Empurrar com força sem mexer na orelha','Puxar a orelha para cima e para trás ao inserir','Deixar só a ponta no canal','Usar um só ouvido'],1,'Puxar a orelha para cima e para trás abre o canal e permite vedação correta.'],

 ['A NR-6 trata de:',['Equipamentos de Proteção Individual','Ergonomia','Eletricidade','Brigada de incêndio'],0,'A NR-6 trata dos EPIs: a empresa fornece o certo e o trabalhador usa e conserva.'],
 ['A NR-10 trata de:',['Trabalho em altura','Segurança em instalações e serviços em eletricidade','Máquinas e equipamentos','Ruído'],1,'A NR-10 trata da segurança em instalações e serviços com eletricidade.'],
 ['A NR-17 trata de:',['Ergonomia','Proteção contra incêndio','Espaço confinado','Transporte de cargas'],0,'A NR-17 trata de ergonomia: adaptação do trabalho às pessoas.'],
 ['A sigla CIPA significa:',['Comissão Interna de Prevenção de Acidentes e de Assédio','Central de Informações e Primeiros Atendimentos','Comitê Industrial de Proteção Ambiental','Comissão de Inspeção e Pagamento de Adicionais'],0,'CIPA é a Comissão Interna de Prevenção de Acidentes e de Assédio (NR-5).'],
 ['Antes de intervir em um equipamento energizado, o correto é:',['Confiar que "deve estar desligado"','Desenergizar, bloquear, etiquetar e testar a ausência de tensão','Trabalhar rápido para reduzir o risco','Pedir a um colega que fique segurando'],1,'Desenergizar, bloquear e etiquetar, e testar a ausência de tensão com instrumento adequado.'],
 ['Quem pode retirar o cadeado de bloqueio e etiquetagem?',['Qualquer pessoa da equipe','O líder, sem avisar','Quem o colocou','O primeiro que chegar'],2,'Cada pessoa usa o seu cadeado e só ela retira, depois de confirmar que está seguro.'],
 ['Você levou um choque leve e se sente bem. O que fazer?',['Esquecer, não foi nada','Comunicar e passar por avaliação médica','Tomar um café','Só avisar no dia seguinte'],1,'Mesmo choque leve deve ser comunicado e avaliado, porque alterações no coração podem aparecer depois.'],
 ['Ao levantar uma carga pesada do chão:',['Curvar a coluna e puxar com as costas','Joelhos flexionados, coluna reta e carga junto ao corpo','Torcer o tronco enquanto levanta','Levantar sempre sozinho'],1,'Pés afastados, joelhos flexionados, coluna reta e carga perto do corpo. Carga pesada pede ajuda.'],
 ['Você sente muito sono ao dirigir de volta do turno. O melhor é:',['Aumentar o rádio','Abrir o vidro e seguir','Parar em local seguro ou pedir carona','Acelerar para chegar logo'],2,'Sonolência ao volante é perigosa. Pare em local seguro, descanse ou peça ajuda.'],
 ['Antes do turno da noite, um cochilo ideal dura cerca de:',['5 minutos','20 a 30 minutos','2 horas','Não existe cochilo ideal'],1,'Cochilos de 20 a 30 minutos ajudam. Mais que isso pode deixar o corpo mais grogue.'],

 ['Perto de partes giratórias ou energizadas, você deve:',['Usar anéis e pulseiras','Retirar anéis, correntes, pulseiras e prender o cabelo','Só retirar o relógio','Nada, o EPI resolve tudo'],1,'Adornos e cabelo solto podem prender ou conduzir energia. Retire e prenda antes de começar.'],
 ['Qual o número do SAMU?',['190','192','193','188'],1,'SAMU é 192. Bombeiros 193. O CVV (apoio emocional) é 188.'],

 ['Você não está em condição de executar uma tarefa de risco (muito cansaço, por exemplo). O correto é:',['Executar mesmo assim','Avisar antes de começar','Passar a tarefa para quem não sabe do risco','Trabalhar mais devagar sem avisar'],1,'Avise o líder antes de iniciar. Segurança vale mais que pressa.']
];
const SK='seg_foco_v1';
let ST=(()=>{try{return Object.assign({perfil:null,contatos:null,relatos:[],best:0,rounds:0,ck:{},ast:null,astStep:0},JSON.parse(localStorage.getItem(SK)||'{}'));}catch(e){return {contatos:null,relatos:[],best:0,rounds:0,ck:{}};}})();
const me=()=>ST.perfil||{nome:'',id:''};
function opBar(){const m=me();if(!m.nome&&!m.id)return '';return `<div class="op">${m.foto?`<img class="ph" src="${m.foto}" alt="">`:''}<div class="g"><small>OPERADOR</small><b>${esc(m.nome||'—')}</b></div><div class="r"><small>ID</small><b>${esc(m.id||'—')}</b></div></div>`;}
function setHdrLogo(){const l=document.querySelector('header .logo');if(!l)return;const f=ST.perfil&&ST.perfil.foto;l.innerHTML=f?`<img src="${f}" alt="">`:'🦺';l.classList.toggle('pf',!!f);}
function repHead(tag,title,small){return `<div class="rh"><div class="camp">CAMPANHA DA CIPA 2026</div><span class="tag">${tag}</span><h2>${title}</h2><small>${small}</small></div>${opBar()}`;}
function meTxt(){const m=me();return m.nome||m.id?'👤 *Operador:* '+(m.nome||'-')+(m.id?' (ID '+m.id+')':'')+'\n':'';}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(ST));return true;}catch(e){return false;}};
if(!ST.contatos)ST.contatos=CONFIG.contatos.map(c=>({...c}));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
let tab='inicio',sub={};
const IC={inicio:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',ast:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16l1.5 1.5L13 14.5"/>',quiz:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',relatar:'<path d="M12 3L2 20h20z"/><path d="M12 10v5M12 18v.5"/>',mais:'<path d="M4 6h16M4 12h16M4 18h16"/>',checar:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'};
const TABS=[['inicio','Início'],['ast','AST'],['quiz','Quiz'],['relatar','Relatar'],['mais','Mais']];
function go(t,s){tab=t;sub=s||{};render();document.getElementById('main').scrollTop=0;}
function ask(titulo,texto,okTxt,fn,ic){
  const o=document.createElement('div');o.className='dlg';
  o.innerHTML=`<div class="dbox" role="dialog" aria-modal="true"><div class="dic">${ic||'❓'}</div><h3>${esc(titulo)}</h3><p>${esc(texto)}</p><div class="dbt"><button class="dno">Cancelar</button><button class="dok">${esc(okTxt||'OK')}</button></div></div>`;
  const close=()=>o.remove();
  o.querySelector('.dno').onclick=close;o.querySelector('.dok').onclick=()=>{close();fn();};
  o.addEventListener('click',e=>{if(e.target===o)close();});
  document.body.appendChild(o);
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200);}
function render(){
  document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${(tab===t[0]||((tab==='checar'||tab==='pare')&&t[0]==='inicio'))?'on':''}" onclick="go('${t[0]}')"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join('');
  setHdrLogo();
  document.getElementById('main').innerHTML=({inicio:vInicio,ast:vAst,checar:vChecar,quiz:vQuiz,relatar:vRelatar,pare:vPare,mais:vMais})[tab]();
}
/* ---- dica do dia ---- */
function flat(){const a=[];SST.forEach(t=>{if(t.k==='ajuda')return;t.items.forEach(x=>a.push({k:t.k,n:t.n,e:t.e,t:x}));});return a;}
function dica(off){const a=flat(),seed=todayS().split('-').reduce((s,x)=>s*31+ +x,7)+(off||0);return a[Math.abs(seed)%a.length];}
function astAndamento(){return typeof A!=='undefined'&&A&&(A.desc||A.risc.length||A.et.some(x=>x.e)||A.part.some(p=>p.n));}
function vInicio(){
  const h=new Date().getHours(),g=h<12?'Bom dia':h<18?'Boa tarde':'Boa noite',d=dica(sub.d||0);
  return `<h1 style="margin-bottom:10px">${g}!</h1>
  <button class="tip" onclick="go('mais',{p:'temas',open:'${d.k}'})"><span class="k">Dica do dia · ${d.e} ${esc(d.n)}</span>${esc(d.t)}</button>
  ${emergHTML()}
  ${(()=>{const k=ckInfo();return `<button class="mrow" onclick="go('checar')"><span class="ic">✅</span><span><b>Checagem antes do turno</b><span class="s">${k.done?(k.no?'Atenção: '+k.no+' item(ns) com Não':'Preenchida · vale até '+k.until):'6 perguntas, menos de 1 minuto'}</span></span>${k.done?`<span class="okb ${k.no?'bad':''}">${k.no?'!':'✓'}</span>`:''}</button>`;})()}
  <button class="mrow" onclick="go('ast')"><span class="ic">📝</span><span><b>${astAndamento()?'AST em andamento':'AST · Análise de Segurança da Tarefa'}</b><span class="s">${astAndamento()?esc(A.desc||'Continuar de onde parou'):'Planeje a tarefa, riscos e controles'}</span></span></button>
  <button class="mrow" onclick="go('pare')"><span class="ic">✋</span><span><b>Registro de PARE</b><span class="s">Registre em menos de 1 minuto, com foto</span></span></button>

  <p class="small muted">Este app não coleta nem envia dados. O que você marca fica só no seu aparelho.</p>`;
}

 turno:{t:'Antes do turno',items:['Dormi o suficiente e me sinto em condição de trabalhar com atenção?','Estou sem tontura, mal-estar ou efeito de remédio que reduza minha atenção?','Conferi meu EPI e ele está em bom estado?','Bebi água e sei onde posso fazer pausa?','Fui informado do que mudou na área e dos riscos de hoje?','Sei como pedir ajuda se algo sair do normal?']},

const CK8=8*3600*1000;
function ckExpire(){if(ST.ckT&&Date.now()-ST.ckT>CK8){ST.ck={};ST.ckT=null;save();}}
function ckState(m){ckExpire();return ST.ck[m]||(ST.ck[m]={});}
function ckInfo(){ckExpire();const s=ST.ck.turno||{},n=CHK.turno.items.length,a=CHK.turno.items.map((_,i)=>s[i]),done=a.every(x=>x!==undefined),no=a.filter(x=>x==='n').length;
  const hh=ST.ckT?new Date(ST.ckT+CK8):null;return {done,no,until:hh?pad(hh.getHours())+':'+pad(hh.getMinutes()):''};}
function setCk(m,i,v){const s=ckState(m);if(!ST.ckT)ST.ckT=Date.now();s[i]=s[i]===v?undefined:v;save();render();}
function resetCk(m){delete ST.ck[m];ST.ckT=null;save();render();}
function vChecar(){
  const m='turno',c=CHK[m],s=ckState(m),ans=c.items.map((_,i)=>s[i]);
  const done=ans.every(x=>x!==undefined),no=ans.filter(x=>x==='n').length;
  const res=!done?`<div class="res wait">Responda todas as perguntas (${ans.filter(x=>x!==undefined).length} de ${c.items.length}).</div>`
    :no?`<div class="res no">Pare. ${no} ${no===1?'item não está':'itens não estão'} ok. Resolva ou avise o líder antes de começar.</div>`
    :`<div class="res ok">Tudo certo. Pode começar com segurança e atenção.</div>`;
  return `<h1>Checagem antes do turno</h1><p class="muted">Responda com sinceridade. Ninguém vê, é só para você.</p>
  <div class="card">${c.items.map((x,i)=>`<div class="ck"><div class="t">${esc(x)}</div><div class="yn"><button class="s ${ans[i]==='s'?'on':''}" onclick="setCk('${m}',${i},'s')">Sim</button><button class="n ${ans[i]==='n'?'on':''}" onclick="setCk('${m}',${i},'n')">Não</button></div></div>`).join('')}</div>
  ${res}
  ${done&&no?`<button class="btn red" style="margin-top:12px" onclick="go('relatar')">Relatar o problema</button>`:''}
  <button class="btn ghost" style="margin-top:12px" onclick="resetCk('${m}')">Limpar respostas</button>
  <p class="small muted" style="margin-top:12px">A checagem é um lembrete e não substitui o procedimento, a permissão de trabalho nem as orientações da sua empresa.</p>`;
}

utos, tempo necessário para outros veículos saírem da rota.","50006015","Transporte de Metal (Fábrica de Alumínio Atomizado)"],["Quando o semáforo de controle de tráfego deve ser acionado?",["Apenas na ida e na volta do trator","Somente antes de sair da área da Refusão","Somente no retorno à Refusão","A cada 10 minutos de trajeto"],1,"O acionamento é necessário apenas antes de sair da área da Refusão; não é necessário no retorno.","50006015","Transporte de Metal (Fábrica de Alumínio Atomizado)"],["Quem deve realizar o engate do trator com a carreta?",["Um segundo operador auxiliando","Apenas um operador sozinho, devido ao risco de atropelamento","O supervisor de turno","Dois operadores, um de cada lado"],1,"É proibido um segundo operador ajudar; essa atividade deve ser feita sozinha devido ao risco de atropelamento.","50006015","Transporte de Metal (Fábrica de Alumínio Atomizado)"],["Em qual marcha o trator deve subir e descer a rampa da Refusão com o cadinho?",["Ponto morto","2ª marcha normal","1ª marcha com a reduzida","Marcha à ré"],2,"Deve subir e descer sempre engatado na 1ª marcha com a reduzida.","50006015","Transporte de Metal (Fábrica de Alumínio Atomizado)"],["Em que condição o cadinho NÃO pode ser transportado?",["Com a manta da tampa checada","Com o bico destampado e sem o tucho de manta","Com o parafuso de segurança apertado","Com o farol e sinalizador ligados"],1,"É proibido transportar o cadinho com o bico destampado e sem o tucho de manta.","50006015","Transporte de Metal (Fábrica de Alumínio Atomizado)"],["Como se deve subir e descer do trator?",["Usando dois pontos de apoio, de costas para o veículo","Usando três pontos de apoio, de frente para o veículo","Pulando diretamente do estribo","Sem necessidade de pontos de apoio fixos"],1,"Deve-se sempre usar três pontos de apoio, de frente para o veículo.","50006015","Transporte de Metal (Fábrica de Alumínio Atomizado)"],["Ao chegar na Fábrica de Alumínio Atomizado, como se deve avisar a chegada?",["Buz 91","9192","9193","9194"],2,"O ramal de emergência indicado é o 9193.","50000582","Verter Metal nos Fornos"],["O que significa a sigla PERA AÍ, ferramenta de prevenção de erro citada no procedimento?",["Pare, Escute, Reflita e Aja","Pare, Examine, Realize e Avalie","Pense, Espere, Realize e Anote","Pare, Estude, Registre e Aja"],1,"PERA AÍ significa Pare, Examine, Realize e Avalie.","50000582","Verter Metal nos Fornos"],["Qual o tempo total estimado da atividade de verter metal nos fornos?",["30 minutos","12 minutos","20 minutos","10 minutos"],1,"O tempo total estimado é de 12 minutos.","50000582","Verter Metal nos Fornos"],["Um cadinho acima de qual tolerância da borda é considerado critério de parada?",["5 a 10 cm","15 cm","20 a 25 cm","1 a 3 cm"],1,"Um cadinho acima de 15 cm da tolerância da borda é critério de parada.","50000582","Verter Metal nos Fornos"],["Durante a operação de verter metal no forno, o que um operador deve fazer pela porta sul?",["Nada, não há necessidade de observação","Permanecer observando o volume de metal","Fechar a porta imediatamente","Aguardar do lado de fora do galpão"],1,"Um operador deve permanecer observando o volume de metal pela porta sul, usando a comunicação 3 vias perto do limite.","50000582","Verter Metal nos Fornos"],["Se a temperatura do cadinho estiver acima de 815°C, o que fazer?",["Verter imediatamente para não atrasar a produção","Permanecer com o cadinho na área até atingir a temperatura correta","Misturar com metal mais frio para verter na hora","Descartar o cadinho"],1,"Deve-se permanecer com o cadinho na área até atingir a temperatura correta, nunca vertendo acima de 815°C.","50000582","Verter Metal nos Fornos"],["Um cadinho com pontos vermelhos é considerado apto para o quê?",["Uso normal na atividade","Critério de parada da atividade","Uso apenas em emergências","Uso se a viagem for curta"],1,"Cadinho com pontos vermelhos é critério de parada da atividade, não devendo ser usado normalmente.","50000582","Verter Metal nos Fornos"],["A sirene da ponte deve ser acionada em qual situação?",["Apenas ao final do turno","Em todo cruzamento de rua, entrada e saída do galpão","Somente durante emergências","Nunca é necessário"],1,"Deve ser acionada em todo cruzamento de rua (entrada e saída do galpão).","50000582","Verter Metal nos Fornos"],["Qual o tempo total estimado desta tarefa?",["30 minutos","40 minutos","20 minutos","15 minutos"],0,"O tempo total estimado é de 30 minutos.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Qual material é proibido para pintar as ferramentas?",["Tinta refratária Holcote Rose","Nitreto de boro","Tinta anticorrosiva padrão","Verniz industrial"],1,"É expressamente proibida a pintura de qualquer ferramenta com nitreto de boro.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Com qual tinta as ferramentas devem ser pintadas?",["Tinta esmalte comum","Tinta refratária Holcote Rose","Tinta spray industrial","Tinta anticorrosiva padrão"],1,"As ferramentas devem ser pintadas com a tinta refratária Holcote Rose.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["O que fazer com um dreno que apresenta trincas?",["Pintá-lo e continuar usando normalmente","Comunicar a supervisão; o dreno não deve ser usado","Usar apenas em cargas menores","Reforçar com solda e seguir usando"],1,"Deve-se comunicar a supervisão; o dreno com trincas não deve ser usado.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Um dreno oxidado deve passar por qual tratamento antes do uso?",["Jateamento, pintura e aquecimento mínimo de 5 minutos","30 minutos","10 minutos","20 minutos"],0,"Deve ser jateado, pintado e aquecido no mínimo por 5 minutos.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Por que as banheiras devem ser untadas com óleo?",["Para facilitar a limpeza posterior","Para evitar risco de explosão","Para aumentar a durabilidade da pintura","Para reduzir o atrito na desenforma"],1,"As banheiras são untadas com óleo para evitar risco de explosão.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Quanto tempo, no mínimo, deve-se aguardar para que o metal do dreno solidifique antes de desenformá-lo?",["30 minutos","45 minutos","1 hora","2 horas"],2,"Deve-se aguardar no mínimo 1 hora para que o metal solidifique antes de desenformar.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Como um dreno vazio deve ser estocado?",["Com a boca voltada para cima","Com a boca voltada para baixo","Deitado horizontalmente","Empilhado sobre outro dreno"],1,"Deve ser mantido de boca para baixo quando estocado vazio.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Por quanto tempo o dreno deve ser pré-aquecido antes de ser reutilizado na Hot-Top?",["50 minutos","No mínimo 5 minutos","20 minutos","30 minutos"],1,"Deve ser pré-aquecido por no mínimo 5 minutos antes do reuso.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Como deve ser feito o aquecimento da haste de agitar metal dentro do forno?",["60 minutos","5 minutos","Por 5 minutos, evitando contato com o metal líquido","15 minutos"],2,"Deve ser aquecida por 5 minutos dentro do forno, evitando contato com o metal líquido.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Por quanto tempo cada panela de escumagem deve ser aquecida após a inspeção?",["15 minutos","5 minutos","60 minutos","30 minutos"],1,"Cada panela de escumagem deve ser aquecida por 5 minutos após a inspeção.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"]],"prod":[["Qual é o volume máximo consecutivo de carregamento para sucata PRENSADA (não confundir com a perfilada ou em bags)?",["2 toneladas","3 toneladas","4 toneladas","5 toneladas"],1,"Sucata prensada: 3 toneladas. Perfilada e em bags: 2 toneladas cada — fácil de trocar.","50004002","Carregamento de Metal Frio nos Fornos"],["Para lastro MENOR OU IGUAL a 6 toneladas, quantos feixes de lingote aquecido devem ser adicionados no congelamento?",["Metade do lastro","2 feixes","3 feixes","4 feixes"],2,"Lastro ≤6t: 3 feixes de lingote aquecido. Lastro >6t: metade do lastro em lingote aquecido — os dois critérios são fáceis de inverter.","50004002","Carregamento de Metal Frio nos Fornos"],["Qual a distância mínima que as pessoas devem manter dos tarugos no momento da sacagem, segundo as Medidas Prevencionistas (não confundir com a distância citada para o operador que aguarda para começar a sacar)?",["5 metros","8 metros","10 metros","12 metros"],1,"As Medidas Prevencionistas exigem distância segura MAIOR que 8 metros das pessoas. Já o operador que vai sacar deve esperar 10 metros de distância de quem estava laçando — os dois números são citados no mesmo procedimento e se confundem facilmente.","50000841","Sacagem de Tarugos"],["A partir de qual diâmetro de tarugo o tempo total da tarefa passa de 30 para 45 minutos?",["178 mm","203 mm","229 mm","152 mm"],2,"152mm, 178mm e 203mm: 30 minutos. Só o diâmetro 229mm sobe para 45 minutos.","50000841","Sacagem de Tarugos"],["Qual é o tempo total da tarefa de abrir/fechar forno em condições normais, sem uso de oxigênio?",["5 minutos","12 minutos","20 minutos","30 minutos"],0,"5 minutos em condição normal. 20 minutos é o tempo SE for necessário usar oxigênio — os dois tempos do mesmo procedimento costumam ser trocados.","50000834","Abrir e Fechar Fornos"],["A que distância mínima do local a ser perfurado deve ficar o suporte do cilindro de oxigênio?",["1 metro","3 metros","5 metros","10 metros"],2,"5 metros — mesmo valor da distância mínima entre pessoas e o cadinho no procedimento 50000582, o que costuma confundir quem decorou só o número.","50000834","Abrir e Fechar Fornos"],["Por quanto tempo o amostrador ou a concha de coleta devem ficar na LATERAL DO FORNO, como alternativa a aquecer com maçarico por 5 minutos?",["5 minutos","15 minutos","20 minutos","30 minutos"],2,"20 minutos na lateral do forno OU 5 minutos com maçarico — as duas opções de aquecimento do mesmo item costumam ser confundidas entre si.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Qual ferramenta tem seu prazo de aquecimento igual ao do amostrador (20 min lateral / 5 min maçarico)?",["Haste de agitar metal","Escumadeira de calhas","Dreno da ICM e filtro Selee","Concha para coleta de amostras"],1,"Escumadeira de calhas segue o mesmo padrão do amostrador (20 min lateral do forno ou 5 min com maçarico). A haste de agitar tem tempo próprio (5 min direto no forno) e os drenos têm mínimo de 5 min de maçarico — sem opção de 20 min lateral.","50001110","Preparar Ferramentas, Banheiras, Drenos e Panelas de Escumagem"],["Qual é a temperatura MÁXIMA do cadinho para verter no forno (não confundir com a mínima para liberar o cadinho da drenagem, de outro procedimento)?",["600°C","790°C","800°C","815°C"],3,"815°C é o máximo para verter no forno. 600°C é a mínima para LIBERAR um cadinho na drenagem (proc. 50005892) — fácil de trocar por serem do mesmo fluxo de cadinho.","50000582","Verter Metal nos Fornos"],["Segundo as Medidas Prevencionistas, qual é a distância MÁXIMA recomendada do cadinho (havendo também uma mínima de 5 metros)?",["8 metros","10 metros","12 metros","15 metros"],1,"Distância mínima de 5 metros e máxima de 10 metros do cadinho.","50000582","Verter Metal nos Fornos"],["Para diâmetros de 7\", 8\" e 9\", por quanto tempo a mesa deve ser aquecida com maçaricos tripé de cada lado (não confundir com o tempo do diâmetro 6\")?",["30 minutos","40 minutos","50 minutos","15 minutos"],0,"30 minutos para 7\", 8\" e 9\". Já o diâmetro 6\" exige 40 minutos — os dois valores pertencem ao mesmo passo e se confundem facilmente.","50001066","Preparar Mesa da Hot-Top para Vazamento"],["Depois do aquecimento principal da mesa, por quanto tempo adicional as EXTREMIDADES da mesa devem ser aquecidas?",["5 minutos","10 minutos","15 minutos","20 minutos"],0,"As extremidades da mesa devem ser aquecidas por mais 5 minutos ao final do processo.","50001066","Preparar Mesa da Hot-Top para Vazamento"],["A partir de qual temperatura MÍNIMA do forno é permitido escumar e amostrar para calcular a adição de anti-liga (não confundir com a mínima para liberar um cadinho)?",["600°C","700°C","790°C","815°C"],1,"700°C é o mínimo para iniciar escumagem/amostragem de anti-liga. 600°C é o mínimo para liberar cadinho (proc. 50005892) — fácil de confundir por serem temperaturas mínimas de processos parecidos.","50000981","Preparação de Fornos: Cálculo e Adição de Anti-ligas"],["Depois de adicionar a anti-liga e agitar por 5 minutos, quanto tempo se deve aguardar antes de retirar nova amostra de composição?",["5 minutos","10 minutos","20 minutos","30 minutos"],2,"Aguardar 20 minutos após a agitação de 5 minutos, antes de nova amostra.","50000981","Preparação de Fornos: Cálculo e Adição de Anti-ligas"],["Qual é a taxa de escumagem definida no procedimento (não confundir com a taxa de sal escorificante de outro procedimento)?",["2 toneladas/hora","5 toneladas/hora","8 toneladas/hora","500g/tonelada"],1,"5 toneladas/hora é a taxa de escumagem. 500g/tonelada é a dosagem de sal escorificante (calculadora de fornos), um número diferente e fácil de misturar.","50000835","Agitar, Escumar Fornos e Prensar Borra"],["A cada quantas escumagens a parte inferior da bacia de prensa deve ser esvaziada (não pode passar de metade da capacidade)?",["A cada escumagem","A cada 2 escumagens","A cada 3 escumagens","Só no fim do turno"],1,"A parte inferior deve ser esvaziada a cada 2 escumagens, nunca ultrapassando metade da capacidade.","50000835","Agitar, Escumar Fornos e Prensar Borra"],["Qual a faixa correta de vazão de ARGÔNIO no A622 (não confundir com a faixa de cloro do mesmo painel)?",["1,5 a 3,0 Nl/min","2,0 Nl/min fixo","95 +/- 4 Nl/min","35 Nl/min fixo"],2,"Argônio: 95 +/- 4 Nl/min. Cloro: faixa 1,5 a 3,0 Nl/min, com taxa de injeção regulada em 2,0 Nl/min. Em espera (pós-final de vazamento), o argônio vai para 35 Nl/min — três valores parecidos, fácil de trocar.","50000982","Produzir Tarugos na Hot-Top (Vazamento)"],["Com o tarugo atingindo qual medida soa o 1º alarme, indicando nível de água mínimo a checar no poço?",["3 metros","5,60 metros","5,90 metros","6,20 metros"],1,"O 1º alarme toca com o tarugo em 5,60m. O 2º alarme (sinal de início do final de vazamento) toca em 5,90m — o comprimento padrão do tarugo. Os dois números do mesmo procedimento se confundem com facilidade.","50000982","Produzir Tarugos na Hot-Top (Vazamento)"],["Após qual metragem de vazamento uma intervenção generalizada na mesa obriga abortar a caída (não confundir com o comprimento padrão do tarugo)?",["150 mm","1,5 metros","3 metros","5,9 metros"],0,"O limite de interferência operacional é de 150mm de vazamento — bem menor que os metros usados para o comprimento do tarugo (5,90m), fácil de confundir a unidade.","50000982","Produzir Tarugos na Hot-Top (Vazamento)"],["Qual é o número máximo de banheiras por pilha no estoque (não confundir com o número de feixes de lingote no congelamento de lastro)?",["2","3","4","6"],2,"Máximo de 4 banheiras por pilha. 3 é o número de feixes de lingote no congelamento de lastro ≤6t (proc. 50004002) — fácil de trocar por serem números pequenos de contextos parecidos.","50001008","Verter Metal nas Banheiras"],["Qual é o tempo mínimo de resfriamento antes de desenformar o metal da banheira?",["30 minutos","1 hora","2 horas","4 horas"],2,"Mínimo de 2 horas de resfriamento antes de desenformar.","50001008","Verter Metal nas Banheiras"],["Entre qual profundidade a ponta do termopar MANUAL deve ser mergulhada no metal (não confundir com o valor de aquecimento do termopar do filtro A622)?",["1 a 3 cm","5 a 10 cm","15 a 20 cm","20 a 25 cm"],1,"5 a 10 cm de profundidade. O 5 (minutos) reaparece em outro contexto no procedimento do termopar do filtro A622 (tempo de pré-aquecimento), o que gera confusão entre 'profundidade' e 'tempo'.","50000980","Medir Temperatura do Metal (Termopar Manual)"],["Um termopar manual NOVO deve ter a haste aquecida por quanto tempo antes do uso (não confundir com o tempo do termopar do Filtro A622)?",["1 minuto","2 minutos","3 minutos","5 minutos"],1,"2 minutos para o termopar manual. Já o termopar do Filtro A622 exige 5 minutos de pré-aquecimento com maçarico — números próximos, fácil de inverter.","50000980","Medir Temperatura do Metal (Termopar Manual)"],["Qual é a temperatura MÍNIMA para liberar o cadinho na drenagem (não confundir com a máxima para verter no forno)?",["500°C","600°C","700°C","790°C"],1,"600°C é o mínimo para liberar o cadinho. 790°C é a temperatura mínima de envio para a Fábrica de Pó em outro procedimento (50001457) — fácil de confundir.","50005892","Pré-aquecer Cadinho e Drenar Metal (Fornos/Fábrica de Pó)"],["Qual é a perda média de temperatura considerada no transporte até a Fábrica de Pó (não confundir com a tolerância de nível do cadinho)?",["15°C","20°C","30°C","50°C"],2,"30°C de perda média no transporte. 15 cm é a tolerância de nível do cadinho em relação à borda — números parecidos, unidades diferentes.","50005892","Pré-aquecer Cadinho e Drenar Metal (Fornos/Fábrica de Pó)"],["Por quanto tempo o termopar do Filtro A622 deve ser pré-aquecido com chama direta do maçarico (não confundir com o tempo do eixo de grafite do mesmo filtro)?",["2 minutos","3 minutos","5 minutos","10 minutos"],2,"5 minutos para o termopar. O eixo de grafite do mesmo filtro A622 também é aquecido por 5 minutos, rotacionando — mesmo tempo, ferramentas diferentes, fácil de confundir qual delas é 'rotacionando' e qual é 'parada'.","50003034","Trocar Termopar do Filtro A622"],["Qual é a periodicidade planejada de troca do eixo de grafite (não confundir com o intervalo de escumagem do filtro do mesmo equipamento)?",["Entre 2 e 4 horas","Entre 15 e 17 dias","Entre 25 e 30 dias","A cada 2 horas sem vazamento"],1,"Entre 15 e 17 dias de uso. 'A cada 2 horas sem vazamento' é o critério de escumagem do Filtro A622 (outro procedimento do mesmo conjunto) — fácil de misturar.","50001010","Troca do Eixo de Grafite e Agitador (Filtro A622)"],["Qual é a faixa de oxigênio que libera a entrada no espaço confinado do poço (não confundir com a faixa de argônio do Filtro A622)?",["19,5 a 21,5%","35 Nl/min","95 +/- 4 Nl/min","1,5 a 3,0%"],0,"19,5 a 21,5% é a faixa segura de oxigênio no ar do espaço confinado — uma medição de concentração de gás no ambiente, bem diferente das vazões de argônio/cloro do A622 (em Nl/min), embora os números pareçam parecidos à primeira vista.","50000997","Limpeza do Poço da Hot-Top"],["Qual é a faixa de temperatura de verificação do Forno e do Filtro A622 antes da drenagem (não confundir com a temperatura mínima do forno para calcular anti-liga)?",["+/- 600°C","+/- 700°C","+/- 710°C","+/- 815°C"],2,"+/- 710°C é a faixa de verificação antes da drenagem do Filtro A622. 700°C é a temperatura mínima (não faixa) para iniciar cálculo de anti-liga em outro procedimento — muito parecidos.","50006349","Escumar, Drenar e Limpar o Filtro A622"],["Qual é o tempo mínimo de aquecimento do filtro cerâmico antes de ser considerado pronto (o mesmo valor aparece também no início e parada de vazamento)?",["5 minutos","10 minutos","15 minutos","20 minutos"],2,"15 minutos — mesmo valor citado no procedimento de iniciar/parar vazamento (50000982), o que reforça (e não deveria confundir) esse número específico.","50000998","Instalar e Aquecer Filtro Cerâmico"],["Qual é a temperatura mínima exigida para envio de metal à Fábrica de Pó (não confundir com a temperatura de recebimento de pó fino/intermediário)?",["600°C","780°C","790°C","795°C"],2,"790°C é a mínima para envio (metal não conforme abaixo disso). 795°C é a temperatura de RECEBIMENTO de pó fino/intermediário no Forno 03/04 (procedimento 50005892) — só 5°C de diferença entre os dois.","50001457","Destino do Metal Não Conforme (Fábrica de Pó)"],["O que é considerado, junto com a falta de manta e tampa no bico, critério de parada relacionado à integridade do cadinho no transporte?",["Falta de parafuso na tampa","Cadinho acima de 15cm da borda","Temperatura abaixo de 600°C","Falta de sinalização luminosa"],0,"Falta de parafuso na tampa é o outro item citado nesse critério de parada específico — os demais são critérios de OUTROS procedimentos (drenagem e liberação de cadinho).","50006015","Transporte de Metal (Fábrica de Alumínio Atomizado)"]],"qual":[["Segundo o Teste Interno do procedimento, o que deve ser verificado após verter metal nas banheiras?",["Se as banheiras foram identificadas corretamente para consumo posterior","Se o metal atingiu 800°C","Se a banheira foi pesada em balança certificada","Se o cliente aprovou o lote"],0,"O Teste Interno exige certificar que as banheiras foram identificadas corretamente para consumo posterior.","50001008","Verter Metal em Banheiras, Identificar e Estocar"],["Antes de desenformar o metal da banheira, quanto tempo mínimo de resfriamento é exigido para garantir a solidificação adequada?",["30 minutos","1 hora","2 horas","4 horas"],2,"É preciso certificar-se de que o metal já esteja solidificado, deixando resfriar por no mínimo 2 horas.","50001008","Verter Metal em Banheiras, Identificar e Estocar"],["Qual é o critério de parada relacionado à qualidade do processo de drenagem em banheiras?",["Não drenar em banheiras não pintadas e não aquecidas","Banheira com mais de 5 anos de uso","Temperatura do metal acima de 900°C","Falta de certificado de calibração da balança"],0,"É proibido drenar em banheiras não pintadas e não aquecidas.","50001008","Verter Metal em Banheiras, Identificar e Estocar"],["Como deve ser feita a identificação individual do metal desenformado?",["Com tinta spray","Com caneta esferográfica, após o operador da Hot-Top chamar para identificar","Com etiqueta impressa do sistema","Não é necessário identificar"],1,"Após desenformar e estocar, chama-se o operador da Hot-Top para identificar individualmente com caneta esferográfica; tinta spray é proibida.","50001008","Verter Metal em Banheiras, Identificar e Estocar"],["Qual é o número máximo de banheiras por pilha, relacionado à organização e rastreabilidade do material estocado?",["2","3","4","6"],2,"As pilhas devem ter altura de no máximo 4 banheiras.","50001008","Verter Metal em Banheiras, Identificar e Estocar"],["Onde as banheiras e moldes devem ser estocados, para evitar problema de qualidade por infiltração de água?",["Em qualquer área externa disponível","Em lugares cobertos","Próximos ao forno para manter aquecidos","Empilhados ao ar livre sobre paletes"],1,"Banheiras e moldes devem ser estocados em lugares cobertos devido a riscos de infiltração de água.","50001008","Verter Metal em Banheiras, Identificar e Estocar"],["Qual é o objetivo de qualidade descrito no Resultado Esperado deste procedimento?",["Medição da temperatura do metal dentro do especificado pelo cliente, executada com segurança","Reduzir o tempo de medição para menos de 1 minuto","Eliminar o uso do termopar manual","Garantir a limpeza do cadinho"],0,"O resultado esperado é a medição da temperatura do metal dentro do especificado pelo cliente, com segurança.","50000980","Medir Temperatura do Metal com Termopar Manual"],["Antes de usar o medidor manual de temperatura, o que deve ser verificado para garantir a confiabilidade da leitura?",["Se está calibrado, conforme etiqueta de identificação","Se está com bateria nova","Se foi limpo com álcool","Se está lacrado na caixa original"],0,"Deve-se verificar se o medidor está calibrado, conforme etiqueta de identificação.","50000980","Medir Temperatura do Metal com Termopar Manual"],["O que fazer se a validade da calibração do medidor estiver vencida?",["Usar mesmo assim e anotar a divergência","Pegar outro medidor na oficina de manutenção com um técnico","Estimar a temperatura visualmente","Aguardar a próxima calibração programada"],1,"Caso a validade da calibração esteja vencida, deve-se pegar outro medidor na oficina de manutenção, com um técnico.","50000980","Medir Temperatura do Metal com Termopar Manual"],["Segundo o fluxograma de contramedida, se o medidor de temperatura não estiver ok, qual ação garante a continuidade da medição correta?",["Interromper a produção até nova calibração geral","Operador pede para o técnico de manutenção providenciar outro medidor","Usar o termopar sem o medidor","Repetir a medição três vezes com o mesmo aparelho"],1,"A contramedida prevê que o operador peça ao técnico de manutenção que providencie outro medidor.","50000980","Medir Temperatura do Metal com Termopar Manual"],["Onde deve ser mergulhada a ponta do termopar para leitura correta da temperatura do metal?",["Entre 1-3 cm","Entre 5-10 cm","Entre 15-20 cm","Não deve tocar o metal"],1,"A ponta do termopar deve ser mergulhada entre 5 e 10 cm no metal.","50000980","Medir Temperatura do Metal com Termopar Manual"],["Um termopar novo deve ser aquecido por quanto tempo antes do primeiro uso, para garantir leitura confiável?",["30 segundos","2 minutos","5 minutos","10 minutos"],1,"Se for um termopar novo, deve-se aquecer a haste por 2 minutos antes do uso.","50000980","Medir Temperatura do Metal com Termopar Manual"],["Qual é a temperatura mínima abaixo da qual o cadinho nunca deve ser liberado, segundo o procedimento?",["500°C","600°C","700°C","760°C"],1,"Nunca liberar o cadinho com temperatura inferior a 600°C.","50005892","Aquecer Cadinho e Enviar Metal para Fábrica de Pó"],["Qual é a tolerância de nível do cadinho em relação à borda que caracteriza critério de parada na drenagem?",["Cadinho acima da tolerância de 15 cm da borda","Cadinho acima de 30 cm da borda","Cadinho até a borda","Não há tolerância definida"],0,"É critério de parada o cadinho acima da tolerância de 15 cm da borda, devendo voltar o volume adicional ao forno.","5000589 function histAct(kind,i,a){
  const L=kind==='p'?ST.pares:ST.relatos,r=L[i];if(!r)return;

function nowLocal(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}

function relRead(){

function relPhoto(inp,k){
  const o=k==='P'?PR:RP;(k==='P'?prRead:relRead)();o.fotos=o.fotos||[];
  const fs=[...inp.files].slice(0,4-o.fotos.length);inp.value='';
  if(!fs.length){toast('Máximo de 4 fotos.');return;}
  Promise.all(fs.map(f=>new Promise(ok=>{
    const u=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{const M=1400,k=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);
      const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL('image/jpeg',0.85));};
    im.onerror=()=>{URL.revokeObjectURL(u);ok(null);};im.src=u;
  }))).then(r=>{o.fotos.push(...r.filter(Boolean));render();});
}

let PR={tipo:'',nome:'',id:'',local:'',desc:'',acao:'',res:'',fotos:[]};
function prRead(){const g=id=>{const x=document.getElementById(id);return x?(x.value||'').trim():null;};
  [['pl','local'],['pd','desc'],['pa','acao']].forEach(([i,k])=>{const v=g(i);if(v!==null)PR[k]=v;});}
function prSet(k,v){prRead();PR[k]=v;render();}
function prTxt(){return `*REGISTRO DE PARE*\n${PR.tipo==='Pare'?'✋':'⚠️'} *Tipo:* ${PR.tipo==='Pare'?'PARE':'Notificação de Perigo'}\n🕒 *Data:* ${PR.dt}\n`+(PR.local?'📍 *Local:* '+PR.local+'\n':'')+`📝 *Descrição:* ${PR.desc}\n🛠 *Ação tomada:* ${PR.acao}\n${PR.res==='Sim'?'✅':'⏳'} *Resolvido:* ${PR.res}\n${meTxt().trim()||'👤 *Registrado por:* não informado'}${PR.fotos.length?'\n📷 '+PR.fotos.length+' foto(s) no PDF':''}`;}
function prOk(){
  prRead();
  if(!PR.tipo){toast('Escolha: PARE ou Notificação de Perigo.');return false;}
  if(!PR.desc){toast('Descreva o PARE.');return false;}
  if(!PR.acao){toast('Descreva a ação tomada.');return false;}
  if(!PR.res){toast('Informe se está resolvido.');return false;}
  PR.dt=new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});PR.txt=prTxt();return true;
}
function mkPare(){if(prOk())render();}
function thumbs(arr){return Promise.all((arr||[]).map(u=>new Promise(ok=>{const im=new Image();im.onload=()=>{const M=640,k=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);ok(cv.toDataURL('image/jpeg',0.7));};im.onerror=()=>ok(null);im.src=u;}))).then(r=>r.filter(Boolean));}
async function histPush(L,rec,fotos){
  rec.fotos=await thumbs(fotos);L.unshift(rec);L.splice(20);L.forEach((r,i)=>{if(i>=8)delete r.fotos;});
  if(!save()){let t=false;L.forEach(r=>{if(r.fotos&&r.fotos.length){delete r.fotos;t=true;}});save();return t?'sem':'erro';}
  return 'ok';
}
async function prSave(){
  if(!PR.txt&&!prOk())return;
  ST.pares=ST.pares||[];
  const r=await histPush(ST.pares,{d:Date.now(),tipo:PR.tipo==='Pare'?'PARE':'Notificação de Perigo',data:{tipo:PR.tipo,local:PR.local,desc:PR.desc,acao:PR.acao,res:PR.res,dt:PR.dt},rows:[['Data',PR.dt],['Local / área',PR.local],['Descrição',PR.desc],['Ação tomada',PR.acao],['Resolvido',PR.res],['Registrado por',me().nome?me().nome+(me().id?' · ID '+me().id:''):'']],txt:PR.txt.replace(/\n📷.*$/,'')},PR.fotos);
  toast(r==='ok'?'PARE salvo neste aparelho.':'Salvo, mas sem as fotos (aparelho sem espaço).');prNovo();
}

function astTxt(){
  const L=[],j=a=>a.length?a.join('; '):'nenhum marcado',hasN=astHasN();
  L.push('*AST – ANÁLISE DE SEGURANÇA DA TAREFA*','_Campanha da CIPA 2026 · Apoio digital. Não substitui a AST oficial assinada._','');if(meTxt())L.push(meTxt().trim(),'');
  if(hasN)L.push('⚠️ *ATENÇÃO: houve resposta N no check de segurança. PARE e busque ajuda antes de iniciar.*','');
  L.push('📝 *Tarefa/OS:* '+(A.desc||'-'),'🏭 *Área/equipamento:* '+(A.area||'-')+'  |  *Turno:* '+(A.turno||'-'),'🕒 *Início:* '+fmtDT(A.ini)+'  |  *Fim previsto:* '+(A.fim?fmtDT(A.fim):'-'),'👥 *Equipe:* '+(A.equipe||'-'),'');
  L.push('🔴 *Riscos críticos:* '+j(A.risc),'📄 *Permissões:* '+j(A.perm),'🌐 *Riscos do ambiente:* '+j(A.amb),'🧠 *Armadilhas para o erro:* '+j(A.arm),'🦺 *EPIs:* '+j(A.epi)+(A.epiTipos?' ('+A.epiTipos+')':'')+(A.epiOut?' | Outros: '+A.epiOut:''),'');
  L.push('📞 *Cadeia de ajuda*','Execução: '+(A.exec||'-'),'Segurança: '+(A.seg||'-'),'Emergência: '+(A.emerg||'-')+(A.meio.length?' ('+A.meio.join(', ')+')':''),'');
  const et=A.et.filter(x=>x.e||x.r);
  L.push('📋 *Planejamento*');if(et.length)et.forEach((x,i)=>L.push((i+1)+') '+(x.e||'-')+' → risco: '+(x.r||'-')));else L.push('Nenhuma etapa registrada');
  L.push('','✅ *Controles críticos*');if(A.ctrl.length)A.ctrl.forEach(c=>L.push('• '+c));else L.push('Nenhum marcado');
  if(A.outros)L.push('Outros: '+A.outros);
  L.push('🛠 *Ferramenta de DHO*');if(A.dho.length)A.dho.forEach(m=>L.push('• '+m+(A.dhoT[m]?': '+A.dhoT[m]:'')));else L.push('Nenhuma marcada');L.push('');
  L.push('🙋 *Meu check de segurança*');
  A.part.filter(p=>p.n).forEach(p=>L.push(p.n+': '+p.a.map(x=>x==='s'?'✅':x==='n'?'❌':'▫️').join(' ')));
  if(A.rein.length){L.push('','🔁 *Reinício da tarefa*');A.rein.forEach(r=>L.push(r.dh+' | '+(r.ok==='s'?'AST válida':r.ok==='n'?'Nova AST':'?')+' | Líder: '+(r.lider||'-')+' | ID: '+(r.id||'-')));}
  if(A.ltif.nome||A.ltif.id)L.push('','🔎 *Verificação de LTIF:* '+(A.ltif.nome||'-')+' | ID '+(A.ltif.id||'-')+' | '+(A.ltif.data?fmtDT(A.ltif.data):'-'));
  if(A.melhor||A.pares)L.push('','🏁 *Fechamento*','O que poderia ter sido melhor: '+(A.melhor||'-'),'PAREs realizados: '+(A.pares||'-'));
  return L.join('\n');
}

}

  const v=x=>x?e(x):'—';
  const et=A.et.filter(x=>x.e||x.r);
  const ctrl=AST_CTRL.map(g=>{const sel=g.c.filter(c=>A.ctrl.includes(c));return sel.length?`<div class="grp"><div>${e(g.n)}</div><ul>${sel.map(c=>`<li>${e(c)}</li>`).join('')}</ul></div>`:'';}).join('');
  const parts=A.part.filter(p=>p.n);

   <div class="ft">Gerado no app Segurança em Foco. Apoio digital para planejar e treinar; não substitui a AST oficial assinada em papel.</div></div>`;

const PW=420,PH=594;
async function astPages(whole){
  const el=document.querySelector('.rep');if(!el)throw new Error('sem relatório');
  const wrap=document.createElement('div');
  wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
  wrap.setAttribute('style','width:'+PW+'px;padding:16px;background:#ffffff;box-sizing:border-box;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#14263A');
  wrap.appendChild(el.cloneNode(true));
  const meas=wrap.cloneNode(true);meas.style.position='fixed';meas.style.left='-9999px';meas.style.top='0';document.body.appendChild(meas);
  const H0=meas.offsetHeight;meas.remove();
  const SH=Math.ceil(H0*1.4)+120;
  const css=[...document.styleSheets].map(ss=>{try{return [...ss.cssRules].map(r=>r.cssText).join('\n');}catch(e){return '';}}).join('\n');
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+PW+'" height="'+SH+'"><foreignObject x="0" y="0" width="100%" height="100%"><style><![CDATA['+css+']]></style>'+new XMLSerializer().serializeToString(wrap)+'</foreignObject></svg>';
  const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await img.decode();
  const sc=3,FW=PW*sc,FH=SH*sc,full=document.createElement('canvas');full.width=FW;full.height=FH;
  const fx=full.getContext('2d',{willReadFrequently:true});fx.fillStyle='#fff';fx.fillRect(0,0,FW,FH);fx.drawImage(img,0,0,FW,FH);
  const d=fx.getImageData(0,0,FW,FH).data,x0=24*sc,x1=FW-24*sc;
  const blank=new Uint8Array(FH);let end=0;
  for(let y=0;y<FH;y++){let ok=1;const o=y*FW*4;for(let x=x0;x<x1;x+=2){const i=o+x*4;if(d[i]<250||d[i+1]<250||d[i+2]<250){ok=0;break;}}blank[y]=ok;if(!ok)end=y;}
  const HR=Math.min(FH,end+10*sc),PHs=PH*sc,LIM=(PH-30)*sc,cuts=[];let y0=0;
  while(HR-y0>LIM){
    let c=0;
    for(const [L,W] of [[24*sc,130*sc],[14*sc,130*sc],[10*sc,240*sc],[5*sc,400*sc],[2*sc,500*sc]]){let run=0;
      for(let r=y0+LIM;r>y0+LIM-W&&r>y0+60*sc;r--){if(blank[r]){run++;if(run>=L){c=r+(L>>1);break;}}else run=0;}
      if(c)break;}
    if(!c)c=y0+LIM;
    for(let it=0;it<2;it++){
      let r=c;while(r>y0&&blank[r])r--;
      const bot=r;while(r>y0&&!blank[r])r--;
      let run=0;while(r-run>y0&&blank[r-run])run++;
      if(bot-r<=28*sc&&run>=12*sc&&r-(run>>1)>y0+60*sc)c=r-(run>>1);else break;
    }
    cuts.push([y0,c]);y0=c;
  }
  cuts.push([y0,HR]);
  if(whole){const cv=document.createElement('canvas');cv.width=FW;cv.height=HR+6*sc;const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,FW,cv.height);c.drawImage(full,0,0,FW,HR,0,0,FW,HR);return [cv];}
  const n=cuts.length;
  return cuts.map(([a,b],k)=>{
    const cv=document.createElement('canvas');cv.width=FW;cv.height=PHs;
    const c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,FW,PHs);
    c.drawImage(full,0,a,FW,b-a,0,0,FW,b-a);
    c.fillStyle='#6B7C8E';c.font=(11*sc)+'px system-ui,sans-serif';c.textAlign='center';c.fillText('Segurança em Foco · página '+(k+1)+' de '+n,FW/2,(PH-10)*sc);
    return cv;
  });
}
const cvBlob=(cv,t,q)=>new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error('falha')),t,q));
let FPFX='AST';
function astStamp(){const d=new Date();return FPFX+'-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes());}
async function astPdf(){
  const pg=await astPages(true),enc=new TextEncoder(),parts=[],off=[];let len=0;
  const put=x=>{const u=typeof x==='string'?enc.encode(x):x;parts.push(u);len+=u.length;};
  const obj=(id,f)=>{off[id]=len;put(id+' 0 obj\n');f();put('\nendobj\n');};
  const N=pg.length,jp=[];
  for(const cv of pg)jp.push(new Uint8Array(await (await cvBlob(cv,'image/jpeg',0.93)).arrayBuffer()));
  put('%PDF-1.4\n');
  obj(1,()=>put('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>put('<</Type/Pages/Count '+N+'/Kids['+pg.map((_,k)=>(3+k*3)+' 0 R').join(' ')+']>>'));
  pg.forEach((cv,k)=>{const p=3+k*3;
    obj(p,()=>put('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 '+(595*cv.height/cv.width).toFixed(1)+']/Resources<</XObject<</I'+k+' '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
    const cs='q 595 0 0 '+(595*cv.height/cv.width).toFixed(1)+' 0 0 cm /I'+k+' Do Q';
    obj(p+1,()=>put('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
    obj(p+2,()=>{put('<</Type/XObject/Subtype/Image/Width '+cv.width+'/Height '+cv.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jp[k].length+'>>\nstream\n');put(jp[k]);put('\nendstream');});
  });
  const tot=3+N*3,xr=len;
  let x='xref\n0 '+tot+'\n0000000000 65535 f \n';for(let i=1;i<tot;i++)x+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  put(x+'trailer\n<</Size '+tot+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
  return new File([new Blob(parts)],astStamp()+'.pdf',{type:'application/pdf'});
}
async function astImgs(){const pg=await astPages(),st=astStamp();return Promise.all(pg.map(async(cv,k)=>new File([await cvBlob(cv,'image/png')],st+'-p'+(k+1)+'.png',{type:'image/png'})));}
function astDown(f){const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
async function astSend(kind,share,pfx){FPFX=pfx||'AST';
  try{toast(kind==='pdf'?'Gerando PDF...':'Gerando imagens...');
    const fs=kind==='pdf'?[await astPdf()]:await astImgs();
    if(share&&navigator.canShare&&navigator.canShare({files:fs})){await navigator.share({files:fs,title:'AST'});}
    else{for(const f of fs){astDown(f);await new Promise(r=>setTimeout(r,400));}toast('Salvo no aparelho.');}
  }catch(e){if(e&&e.name==='AbortError')return;toast('Não consegui gerar o arquivo.');}
}
function astCopy(){const t=astTxt();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(()=>toast('Copiado.'),()=>fb(t));else fb(t);}
function astShare(){const t=astTxt();if(navigator.share)navigator.share({text:t}).catch(()=>{});else window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}
